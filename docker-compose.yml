services:
  client:
    image: ghcr.io/${GITHUB_REPOSITORY:-mdtha-x/rosetta-for-all}-client:latest
    build: ./client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

  server:
    image: ghcr.io/${GITHUB_REPOSITORY:-mdtha-x/rosetta-for-all}-server:latest
    build: ./server
    restart: always
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - rosetta-data:/app/data

volumes:
  rosetta-data:
