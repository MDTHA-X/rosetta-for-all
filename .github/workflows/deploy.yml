name: Rosetta CI/CD Pipeline (Quality Gate & VPS Deploy)

on:
  push:
    branches: [ "main", "predeploy" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ==============================================================
  # STAGE 1: POSTMAN AUTOMATED QUALITY GATE (107 Tests)
  # ==============================================================
  postman-quality-gate:
    name: 🧪 Automated Quality Gate (107 Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm install -g newman

      - name: Validate Frontend Production Build
        run: npm run build

      - name: Start Rosetta Backend Server
        run: |
          node server.js &
          sleep 3

      - name: Run Chunk 1 (57 tests)
        run: |
          newman run Rosetta_API_Tests_Chunk1_of_2.postman_collection.json \
            --env-var baseUrl=http://localhost:3000/api \
            --env-var token=test-token

      - name: Run Chunk 2 (50 tests)
        run: |
          newman run Rosetta_API_Tests_Chunk2_of_2.postman_collection.json \
            --env-var baseUrl=http://localhost:3000/api \
            --env-var token=test-token

  # ==============================================================
  # STAGE 2: PRODUCTION DEPLOYMENT (Only triggers on main branch)
  # ==============================================================
  deploy-production:
    name: 🚀 Deploy to Azure VPS (Production)
    needs: [postman-quality-gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ~/app && cd ~/app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull || true
            docker compose up -d --remove-orphans
            docker image prune -f