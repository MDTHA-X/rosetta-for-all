name: Rosetta CI/CD Pipeline (Quality Gate & VPS Deploy)

on:
  push:
    branches: [ "main", "predeploy" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  
  postman-quality-gate:
    name: 🧪 Automated Quality Gate (107 Tests)
    runs-on: ubuntu-latest
    
    
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'server/package.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci || npm install
          npm install -g newman

      - name: Install Client Dependencies & Build Frontend
        run: |
          cd client
          npm ci || npm install
          npm run build

      - name: Start Rosetta Backend Server
        run: |
          cd server
          node server.js &
          npx wait-on http://localhost:3000/api/health --timeout 15000

      - name: Run Chunk 1 (57 tests)
        run: |
          cd server
          newman run testcases/Rosetta_API_Tests_Chunk1_of_2.postman_collection.json \
            --env-var baseUrl=http://localhost:3000 \
            --env-var token=test-token

      - name: Run Chunk 2 (50 tests)
        run: |
          cd server
          newman run testcases/Rosetta_API_Tests_Chunk2_of_2.postman_collection.json \
            --env-var baseUrl=http://localhost:3000 \
            --env-var token=test-token

  
            
  deploy-production:
    name: 🚀 Deploy to Azure VPS (Production)
    needs: [postman-quality-gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Name
        run: |
          echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ env.IMAGE_BASE }}-server:latest

      - name: Build & Push Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ env.IMAGE_BASE }}-client:latest

      - name: Copy docker-compose.yml to Azure VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "~/app"

      - name: Deploy to Azure VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo systemctl stop nginx || true
            sudo systemctl disable nginx || true
            mkdir -p ~/app && cd ~/app
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose down || true
            docker compose pull || true
            docker compose up -d --remove-orphans
            docker image prune -f